[project]
name = "trano-optimization"
version = "0.1.0"
description = "Optimal control, moving horizon estimation and simulation of Modelica models with rumoca, CasADi and IPOPT."
authors = [{ name = "Ando Andriamamonjy", email = "andoludovic.andriamamonjy@gmail.com" }]
requires-python = ">=3.11,<4.0"
readme = "README.md"
license = {text = "LGPL-3.0-or-later"}
keywords = ["modelica", "casadi", "model predictive control", "optimal control", "building energy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.13.4,<3",
    "numpy>=2.0,<3",
    "casadi>=3.6.7,<4",
    "rumoca>=0.10.3,<0.11",
]

[project.urls]
Repository = "https://github.com/andoludo/trano-optimization"

[dependency-groups]
dev = [
    "mypy>=2.1.0,<3",
    "ruff>=0.15.16,<0.16",
    "pytest>=9.0.3,<10",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
# rumoca 0.10.3 from its main branch, where connected models are exported to CasADi; the later commits of main refuse
# the pressure-driven valves and the heat pump of trano's FastModel (residual_equations of casadi-ode). A project
# depending on trano-optimization repeats this source: uv does not read the sources of a dependency.
rumoca = { git = "https://github.com/CogniPilot/rumoca", rev = "33c21141791cbc341f4788ff6353d2f49d1c740a", subdirectory = "crates/rumoca-bind-python" }

[tool.uv.build-backend]
module-root = ""
source-include = ["LICENSE"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
plugins = "pydantic.mypy"
packages = ["trano_optimization"]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
show_absolute_path = true
disallow_untyped_defs = true
strict = true
exclude = ["test_*", "conftest.py"]

[[tool.mypy.overrides]]
module = ["casadi", "casadi.*", "rumoca", "rumoca.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "B006","RUF","UP","SIM","FURB","PIE","PERF","C4","B","PL","S","C901","N","ANN", "ERA001", "PD"]
ignore = ["UP006", "UP035"]
extend-ignore = ["S101","PLR2004","W291","UP042","PLC0415"]
fixable = ["ALL"]
unfixable = []
